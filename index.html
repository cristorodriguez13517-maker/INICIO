<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Netflix Smart TV - Menu Lateral Oscuro</title>

<style>
* { box-sizing:border-box; margin:0; padding:0; }

body {
  background:#000;
  color:#fff;
  font-family:Arial,sans-serif;
  overflow-x:hidden;
}

a, button {
  outline: none;
  -webkit-tap-highlight-color: transparent;
}

a:focus,
a:active,
a:focus-visible {
  outline: none;
  background: transparent;
}

/* Header fullscreen */
.header {
  position: relative;
  width: 100%;
  height: 100vh;
  background-size: cover;
  background-position: center;
  transition: background-image 1s ease-in-out;
}

/* Sombra lateral */
.header::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 380px;
  height: 100%;
  background: linear-gradient(
    to right,
    rgba(0,0,0,0.90) 0%,
    rgba(0,0,0,0.75) 30%,
    rgba(0,0,0,0) 75%
  );
  z-index: 5;
  pointer-events: none;
}

/* Menú lateral */
.header-top {
  position: absolute;
  top: 50%;
  left: 0;
  transform: translateY(-50%);
  width: 200px;
  display: flex;
  flex-direction: column;
  gap: 25px;
  padding-left: 20px;
  z-index: 10;
}

.menu {
  display: flex;
  flex-direction: column;
  gap: 25px;
}

.menu-item {
  color: #fff;
  text-decoration: none;
  font-weight: bold;
  font-size: 18px;
  transition: color 0.2s, transform 0.2s;
  cursor: pointer;
  text-shadow: 0 0 10px rgba(0,0,0,0.9);
}

.menu-item:hover,
.menu-item:focus,
.menu-item.active {
  color: #E50914;
  transform: scale(1.1);
}

/* Logo */
.header-logo {
  position: absolute;
  bottom: 60px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
}

.header-logo img {
  max-width: 300px;
  width: 100%;
  object-fit: contain;
  filter: drop-shadow(0 0 15px rgba(0,0,0,0.9));
  transition: opacity 1.0s ease;
}
</style>
</head>

<body>

<div class="header" id="header">

  <div class="header-top">
    <nav class="menu">
      <a href="https://cristorodriguez13517-maker.github.io/DOCUMENTALES/" class="menu-item">Documental</a>
      <a href="https://cristorodriguez13517-maker.github.io/PEL-CULAS-/" class="menu-item">Películas</a>
      <a href="https://cristorodriguez13517-maker.github.io/SERIES/" class="menu-item">Series</a>
      <a href="https://cristorodriguez13517-maker.github.io/KIDS/" class="menu-item">Kids</a>
      
    </nav>
  </div>

  <div class="header-logo">
    <img id="header-logo-img" src="">
  </div>

</div>

<script>
const header = document.getElementById('header');
const logoImg = document.getElementById('header-logo-img');

/* 🌐 IMÁGENES */
const banners = [
  <!--  banners 25/8 -->
  "https://image.tmdb.org/t/p/original/8sSKdEmlmqF4kJUd28SqthXC4yZ.jpg",
  <!--  banners 25/8 -->
  "https://image.tmdb.org/t/p/original/2xpc4Lrl9mEHbuUkGR0I6k9haf.jpg",
  <!--  banners 20/8 -->
  "https://image.tmdb.org/t/p/original/hKuuZVP0dlTB8hZvggQcV9f2tWp.jpg",
  <!--  banners 15/7 -->
  "https://image.tmdb.org/t/p/original/xBT0oNq6rsTFv4SxG5uGRIEOrq6.jpg",
  <!--  banners 15/8 -->
  "https://image.tmdb.org/t/p/original/q5LJT8QYjUU4uKlT9x2aQpxz09t.jpg"
];

const logos = [
  <!--  logos 25/8 -->
  "https://image.tmdb.org/t/p/original/w591RAh8h5R0F5cA2QcyBv7B4WI.png",
  <!--  logos 25/8-->
  "https://image.tmdb.org/t/p/original/6vSwf2Y5wkT3BildOe3YLl7EI65.png",
  <!--  logos 20/8-->
  "https://image.tmdb.org/t/p/original/aOXR95D0hhKUOtTAjt96vX3fubt.png",
  <!--  logos 15/7-->
  "https://image.tmdb.org/t/p/original/6Q34kuByPGmsocjjbkn1DOaccz4.png",
  <!--  logos 15/8-->
  "https://image.tmdb.org/t/p/original/7yh4xnDB8rKcSZB8IJuJmNsrwu6.png"
];

let currentIndex = -1;

/* 🎲 Índice aleatorio sin repetir consecutivo */
function getRandomIndex() {
  let newIndex;
  do {
    newIndex = Math.floor(Math.random() * banners.length);
  } while (newIndex === currentIndex);
  return newIndex;
}

/* 🔁 Cambiar slide */
function cambiarSlide() {

  currentIndex = getRandomIndex();

  /* Fondo */
  header.style.backgroundImage = `url('${banners[currentIndex]}')`;

  /* Logo con fade */
  logoImg.style.opacity = 0;

  setTimeout(() => {
    logoImg.src = logos[currentIndex];
    logoImg.style.opacity = 1;
  }, 300);
}

/* 🚀 Inicio */
cambiarSlide();

/* ⚡ Precarga de imágenes */
banners.forEach(src => {
  const img = new Image();
  img.src = src;
});

/* ⏱️ Auto cambio */
setInterval(cambiarSlide, 5000);


/* 🎮 Menú */
const menuItems = document.querySelectorAll('.menu-item');

menuItems.forEach(item=>{
  item.addEventListener('mouseenter', () => {
    item.classList.add('active');
  });

  item.addEventListener('mouseleave', () => {
    item.classList.remove('active');
  });
});
</script>

</body>
</html>
