<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHARKTV</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #000;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
}

/* BANNER PRINCIPAL */

.header {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100vh;
    background-size: cover;
    background-position: center top;
    background-repeat: no-repeat;
    transition: background-image 0.8s ease-in-out;
}

/* SOMBRA LATERAL */

.header::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(
        to right,
        rgba(0,0,0,0.96) 0%,
        rgba(0,0,0,0.78) 18%,
        rgba(0,0,0,0.25) 48%,
        rgba(0,0,0,0.05) 100%
    );
    opacity: 0;
    transition: opacity 0.45s ease;
    pointer-events: none;
}

.header.menu-visible::before {
    opacity: 1;
}

/* LOGO SHARKTV */

.logo-principal {
    position: absolute;
    bottom: 35px;
    left: 50%;
    transform: translateX(-50%);
    width: 180px;
    max-height: 90px;
    object-fit: contain;
    z-index: 5;
}

/* MENU */

.menu-container {
    position: absolute;
    top: 50%;
    left: 65px;
    transform: translateY(-50%);
    z-index: 10;

    opacity: 0;
    visibility: hidden;
    transform: translate(-35px, -50%);

    transition:
        opacity 0.35s ease,
        transform 0.35s ease,
        visibility 0.35s;
}

.header.menu-visible .menu-container {
    opacity: 1;
    visibility: visible;
    transform: translate(0, -50%);
}

/* VENTANA QUE MUESTRA SOLO TRES OPCIONES */

.menu-viewport {
    height: 150px;
    overflow: hidden;
    position: relative;
}

/* LISTA COMPLETA */

.menu {
    display: flex;
    flex-direction: column;
    gap: 12px;
    transition: transform 0.3s ease;
    will-change: transform;
}

/* OPCIONES */

.menu-item {
    width: 280px;
    height: 42px;
    flex-shrink: 0;

    display: flex;
    align-items: center;

    padding: 0 20px;

    font-size: 23px;
    font-weight: 600;
    letter-spacing: 0.3px;

    color: rgba(255,255,255,0.78);

    border-left: 4px solid transparent;

    cursor: pointer;
    text-decoration: none;

    transition:
        color 0.2s,
        background 0.2s,
        border-color 0.2s;
}

/* OPCION SELECCIONADA */

.menu-item.selected {
    color: #fff;
    background: rgba(255,255,255,0.10);
    border-left: 4px solid #e50914;
    padding-left: 25px;
    text-shadow: 0 0 12px rgba(255,255,255,0.3);
}

/* MENSAJE PROXIMAMENTE */

.aviso {
    position: absolute;
    bottom: 125px;
    left: 50%;
    transform: translateX(-50%) translateY(15px);

    background: rgba(20,20,20,0.95);
    border: 1px solid rgba(255,255,255,0.15);
    padding: 12px 25px;
    border-radius: 5px;

    font-size: 16px;
    opacity: 0;
    visibility: hidden;
    transition: 0.25s;
    z-index: 20;
}

.aviso.visible {
    opacity: 1;
    visibility: visible;
    transform: translateX(-50%) translateY(0);
}

/* MÓVILES */

@media (max-width: 700px) {
    .menu-container {
        left: 20px;
    }

    .menu-item {
        width: 230px;
        font-size: 19px;
    }

    .logo-principal {
        width: 140px;
        bottom: 25px;
    }

    .header {
        background-position: center center;
    }
}
</style>
</head>

<body>

<div class="header" id="header">

    <div class="menu-container">

        <div class="menu-viewport">
            <nav class="menu" id="menu">

                <a class="menu-item selected"
                   href="https://cristorodriguez13517-maker.github.io/PELICULAS/">
                    Películas
                </a>

                <a class="menu-item"
                   href="https://cristorodriguez13517-maker.github.io/SERIES/">
                    Series
                </a>

                <a class="menu-item"
                   href="https://cristorodriguez13517-maker.github.io/KIDS/">
                    Kids
                </a>

                <a class="menu-item"
                   href="#"
                   data-coming-soon="true">
                    Colecciones
                </a>

                <a class="menu-item"
                   href="#"
                   data-coming-soon="true">
                    Deportes
                </a>

            </nav>
        </div>

    </div>

    <img
        class="logo-principal"
        src=""
        alt="SHARKTV"
    >

    <div class="aviso" id="aviso">
        Próximamente
    </div>

</div>

<script>

/* =====================================
   DIRECCIONES DE LOS CATÁLOGOS JSON
===================================== */

const CATALOGOS = [
    "https://cristorodriguez13517-maker.github.io/PELICULAS/peliculas.json",

    "https://cristorodriguez13517-maker.github.io/SERIES/series.json",

    "https://cristorodriguez13517-maker.github.io/KIDS/peliculas.json"
];


/* =====================================
   VARIABLES
===================================== */

const header = document.getElementById("header");
const menu = document.getElementById("menu");
const menuItems = Array.from(
    document.querySelectorAll(".menu-item")
);

const aviso = document.getElementById("aviso");

let banners = [];
let bannerActual = 0;

let selectedIndex = 0;
let menuVisible = false;

let hideTimer = null;
let avisoTimer = null;

const HIDE_DELAY = 5000;
const BANNER_DELAY = 5000;


/* =====================================
   NORMALIZAR IMÁGENES
===================================== */

function normalizarImagen(imagen) {

    if (!imagen || typeof imagen !== "string") {
        return "";
    }

    imagen = imagen.trim();

    if (!imagen) {
        return "";
    }

    if (
        imagen.startsWith("https://") ||
        imagen.startsWith("http://")
    ) {
        return imagen;
    }

    if (imagen.startsWith("/")) {
        return "https://image.tmdb.org/t/p/original" + imagen;
    }

    return imagen;
}


/* =====================================
   EXTRAER REGISTROS JSON
===================================== */

function extraerRegistros(datos) {

    if (Array.isArray(datos)) {
        return datos;
    }

    if (datos && typeof datos === "object") {

        for (const clave of [
            "results",
            "peliculas",
            "series",
            "items",
            "catalogo"
        ]) {
            if (Array.isArray(datos[clave])) {
                return datos[clave];
            }
        }

        return Object.values(datos).filter(
            elemento =>
                elemento &&
                typeof elemento === "object" &&
                !Array.isArray(elemento)
        );
    }

    return [];
}


/* =====================================
   OBTENER FECHA
===================================== */

function obtenerFecha(item) {

    const fecha =
        item.published_at ||
        item.release_date ||
        item.first_air_date ||
        item.date ||
        item.created_at ||
        "";

    const valor = new Date(fecha).getTime();

    return Number.isFinite(valor) ? valor : 0;
}


/* =====================================
   CARGAR CATÁLOGOS
===================================== */

async function cargarCatalogo(url) {

    try {

        const respuesta = await fetch(
            url + "?t=" + Date.now(),
            { cache: "no-store" }
        );

        if (!respuesta.ok) {
            throw new Error("Error HTTP " + respuesta.status);
        }

        const datos = await respuesta.json();

        return extraerRegistros(datos);

    } catch (error) {

        console.error("No se pudo cargar:", url, error);

        return [];
    }
}


/* =====================================
   ELIMINAR BANNERS REPETIDOS
===================================== */

function eliminarDuplicados(lista) {

    const vistos = new Set();

    return lista.filter(item => {

        const clave =
            item.backdrop ||
            item.youtube_id ||
            item.tmdb_id ||
            item.id;

        if (!clave || vistos.has(clave)) {
            return false;
        }

        vistos.add(clave);

        return true;
    });
}


/* =====================================
   PRECARGAR IMÁGENES
===================================== */

function precargarImagen(url) {

    return new Promise(resolve => {

        const imagen = new Image();

        imagen.onload = () => resolve(true);
        imagen.onerror = () => resolve(false);

        imagen.src = url;
    });
}


/* =====================================
   MOSTRAR BANNER
===================================== */

async function cambiarSlide() {

    if (!banners.length) {
        return;
    }

    const item = banners[bannerActual];

    const fondo = item.backdrop;
    const logo = item.logo;

    header.style.backgroundImage =
        `url("${fondo}")`;

    const logoPrincipal =
        document.querySelector(".logo-principal");

    logoPrincipal.src = logo;

    bannerActual++;

    if (bannerActual >= banners.length) {
        bannerActual = 0;
    }
}


/* =====================================
   INICIAR CARRUSEL
===================================== */

async function iniciarSharkTV() {

    const resultados = await Promise.all(
        CATALOGOS.map(url => cargarCatalogo(url))
    );

    let todos = resultados.flat();

    todos = todos.map(item => {

        return {
            ...item,
            backdrop: normalizarImagen(item.backdrop),
            logo: normalizarImagen(item.logo),
            fecha: obtenerFecha(item)
        };

    });

    todos = todos.filter(item =>
        item.backdrop && item.logo
    );

    todos = eliminarDuplicados(todos);

    todos.sort((a, b) => b.fecha - a.fecha);

    banners = todos;

    console.log(
        "Banners cargados en SHARKTV:",
        banners.length
    );

    if (!banners.length) {

        console.warn(
            "No se encontraron registros con backdrop y logo."
        );

        return;
    }

    // Precargar el primer banner
    await precargarImagen(banners[0].backdrop);

    cambiarSlide();

    setInterval(cambiarSlide, BANNER_DELAY);
}


/* =====================================
   CONTROL DEL MENÚ
===================================== */

function actualizarSeleccion() {

    menuItems.forEach((item, index) => {

        item.classList.toggle(
            "selected",
            index === selectedIndex
        );

    });

    // Mostrar únicamente tres opciones a la vez
    const maxInicio = Math.max(0, menuItems.length - 3);

    const inicio = Math.min(
        Math.max(0, selectedIndex - 2),
        maxInicio
    );

    const alturaItem = 42;
    const espacio = 12;
    const desplazamiento = inicio * (alturaItem + espacio);

    menu.style.transform =
        `translateY(-${desplazamiento}px)`;
}


function mostrarMenu() {

    menuVisible = true;

    header.classList.add("menu-visible");

    actualizarSeleccion();

    reiniciarTemporizador();
}


function ocultarMenu() {

    menuVisible = false;

    header.classList.remove("menu-visible");

    clearTimeout(hideTimer);
}


function reiniciarTemporizador() {

    clearTimeout(hideTimer);

    hideTimer = setTimeout(() => {

        ocultarMenu();

    }, HIDE_DELAY);
}


/* =====================================
   AVISO DE APARTADO PRÓXIMAMENTE
===================================== */

function mostrarAviso() {

    aviso.classList.add("visible");

    clearTimeout(avisoTimer);

    avisoTimer = setTimeout(() => {

        aviso.classList.remove("visible");

    }, 1800);
}


/* =====================================
   ABRIR OPCIÓN SELECCIONADA
===================================== */

function abrirSeleccion() {

    const item = menuItems[selectedIndex];

    if (!item) {
        return;
    }

    if (item.dataset.comingSoon === "true") {

        mostrarAviso();

        reiniciarTemporizador();

        return;
    }

    const destino = item.getAttribute("href");

    if (destino && destino !== "#") {
        window.location.href = destino;
    }
}


/* =====================================
   NAVEGACIÓN CON MANDO
===================================== */

document.addEventListener("keydown", function(event) {

    const tecla = event.key;

    if ([
        "ArrowUp",
        "ArrowDown",
        "ArrowLeft",
        "ArrowRight",
        "Enter",
        "Escape",
        "Backspace"
    ].includes(tecla)) {

        event.preventDefault();
    }

    // Abrir el menú si está oculto
    if (!menuVisible) {

        if (
            tecla === "ArrowUp" ||
            tecla === "ArrowDown" ||
            tecla === "ArrowLeft" ||
            tecla === "ArrowRight"
        ) {

            mostrarMenu();

            return;
        }

        return;
    }

    // Navegar hacia abajo
    if (tecla === "ArrowDown") {

        selectedIndex++;

        if (selectedIndex >= menuItems.length) {
            selectedIndex = menuItems.length - 1;
        }

        actualizarSeleccion();

        reiniciarTemporizador();
    }

    // Navegar hacia arriba
    if (tecla === "ArrowUp") {

        selectedIndex--;

        if (selectedIndex < 0) {
            selectedIndex = 0;
        }

        actualizarSeleccion();

        reiniciarTemporizador();
    }

    // Seleccionar
    if (tecla === "Enter") {

        abrirSeleccion();
    }

    // Ocultar menú
    if (
        tecla === "Escape" ||
        tecla === "Backspace"
    ) {

        ocultarMenu();
    }

    // Mantener visible al pulsar izquierda/derecha
    if (
        tecla === "ArrowLeft" ||
        tecla === "ArrowRight"
    ) {

        reiniciarTemporizador();
    }

});


/* =====================================
   NAVEGACIÓN CON RATÓN O PANTALLA TÁCTIL
===================================== */

menuItems.forEach((item, index) => {

    item.addEventListener("mouseenter", () => {

        selectedIndex = index;

        actualizarSeleccion();

        mostrarMenu();
    });

    item.addEventListener("click", event => {

        if (item.dataset.comingSoon === "true") {

            event.preventDefault();

            selectedIndex = index;

            actualizarSeleccion();

            mostrarMenu();

            mostrarAviso();
        }

    });

});


/* =====================================
   ZONA TÁCTIL DEL BORDE IZQUIERDO
===================================== */

document.addEventListener("touchstart", function(event) {

    const toque = event.touches[0];

    if (toque.clientX < 35) {

        if (menuVisible) {
            ocultarMenu();
        } else {
            mostrarMenu();
        }

    }

}, { passive: true });


/* =====================================
   INICIO
===================================== */

actualizarSeleccion();

iniciarSharkTV();

</script>

</body>
</html>
