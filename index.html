<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SHARKTV - Menú Principal</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: #000;
  color: #fff;
  font-family: Arial, sans-serif;
  overflow-x: hidden;
}

a, button {
  outline: none;
  -webkit-tap-highlight-color: transparent;
}

a:focus,
a:active,
a:focus-visible {
  outline: none;
  background: transparent;
}

/* BANNER PRINCIPAL */
.header {
  position: relative;
  width: 100%;
  height: 100vh;
  min-height: 100vh;
  background-size: cover;
  background-position: center;
  background-color: #000;
  transition: background-image 1s ease-in-out;
  overflow: hidden;
}

/* SOMBRA LATERAL */
.header::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 380px;
  height: 100%;
  background: linear-gradient(
    to right,
    rgba(0,0,0,0.90) 0%,
    rgba(0,0,0,0.75) 30%,
    rgba(0,0,0,0) 75%
  );
  z-index: 5;
  pointer-events: none;
}

/* MENÚ LATERAL */
.header-top {
  position: absolute;
  top: 50%;
  left: 0;
  transform: translateY(-50%);
  width: 200px;
  display: flex;
  flex-direction: column;
  gap: 25px;
  padding-left: 20px;
  z-index: 10;
}

.menu {
  display: flex;
  flex-direction: column;
  gap: 25px;
}

.menu-item {
  color: #fff;
  text-decoration: none;
  font-weight: bold;
  font-size: 18px;
  transition: color 0.2s, transform 0.2s;
  cursor: pointer;
  text-shadow: 0 0 10px rgba(0,0,0,0.9);
}

.menu-item:hover,
.menu-item:focus,
.menu-item.active {
  color: #E50914;
  transform: scale(1.1);
}

/* LOGO INFERIOR */
.header-logo {
  position: absolute;
  bottom: 60px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  width: 90%;
  display: flex;
  justify-content: center;
  align-items: center;
}

.header-logo img {
  max-width: 300px;
  max-height: 180px;
  width: 100%;
  object-fit: contain;
  filter: drop-shadow(0 0 15px rgba(0,0,0,0.9));
  transition: opacity 0.8s ease;
}

@media (max-width: 600px) {
  .header::before {
    width: 280px;
  }

  .header-top {
    padding-left: 18px;
    width: 170px;
  }

  .menu-item {
    font-size: 17px;
  }

  .header-logo {
    bottom: 45px;
  }

  .header-logo img {
    max-width: 240px;
    max-height: 140px;
  }
}
</style>
</head>

<body>

<div class="header" id="header">

  <div class="header-top">
    <nav class="menu">
      <a href="https://cristorodriguez13517-maker.github.io/PELICULAS/"
         class="menu-item">Películas</a>

      <a href="https://cristorodriguez13517-maker.github.io/SERIES/"
         class="menu-item">Series</a>

      <a href="https://cristorodriguez13517-maker.github.io/KIDS/"
         class="menu-item">Kids</a>
    </nav>
  </div>

  <div class="header-logo">
    <img id="header-logo-img" src="" alt="">
  </div>

</div>

<script>

/* =========================================
   ELEMENTOS PRINCIPALES
========================================= */

const header = document.getElementById("header");
const logoImg = document.getElementById("header-logo-img");

/* =========================================
   REPOSITORIOS SHARKTV
========================================= */

const catalogos = [
  {
    nombre: "Películas",
    url: "https://cristorodriguez13517-maker.github.io/PELICULAS/peliculas.json"
  },
  {
    nombre: "Series",
    url: "https://cristorodriguez13517-maker.github.io/SERIES/series.json"
  },
  {
    nombre: "Kids",
    url: "https://cristorodriguez13517-maker.github.io/KIDS/peliculas.json"
  }
];

/* =========================================
   CONFIGURACIÓN DEL CARRUSEL
========================================= */

let banners = [];
let currentIndex = -1;

const INTERVALO = 5000;

/* =========================================
   CONVERTIR RUTAS DE IMÁGENES
========================================= */

function normalizarImagen(url) {

  if (!url || typeof url !== "string") {
    return "";
  }

  url = url.trim();

  if (
    !url ||
    url === "null" ||
    url === "undefined"
  ) {
    return "";
  }

  if (
    url.startsWith("http://") ||
    url.startsWith("https://")
  ) {
    return url;
  }

  if (url.startsWith("/")) {
    return "https://image.tmdb.org/t/p/original" + url;
  }

  return "";
}

/* =========================================
   LEER REGISTROS JSON
========================================= */

function extraerRegistros(data) {

  if (Array.isArray(data)) {
    return data;
  }

  if (data && typeof data === "object") {

    if (Array.isArray(data.peliculas)) return data.peliculas;
    if (Array.isArray(data.series)) return data.series;
    if (Array.isArray(data.results)) return data.results;
    if (Array.isArray(data.items)) return data.items;

    if (data.backdrop || data.logo) {
      return [data];
    }

    return Object.values(data).filter(item =>
      item && typeof item === "object"
    );
  }

  return [];
}

/* =========================================
   OBTENER FECHA DE PUBLICACIÓN
========================================= */

function obtenerFecha(item) {

  const posiblesFechas = [
    item.published_at,
    item.release_date,
    item.first_air_date,
    item.date,
    item.created_at
  ];

  for (const fecha of posiblesFechas) {

    if (!fecha) continue;

    const timestamp = Date.parse(fecha);

    if (!isNaN(timestamp)) {
      return timestamp;
    }
  }

  return 0;
}

/* =========================================
   CARGAR CADA REPOSITORIO
========================================= */

async function cargarCatalogo(catalogo) {

  try {

    const respuesta = await fetch(
      catalogo.url + "?v=" + Date.now(),
      { cache: "no-store" }
    );

    if (!respuesta.ok) {
      throw new Error("HTTP " + respuesta.status);
    }

    const data = await respuesta.json();

    const registros = extraerRegistros(data);

    const elementos = registros.map(item => {

      const backdrop = normalizarImagen(
        item.backdrop || item.backdrop_path || item.banner
      );

      const logo = normalizarImagen(
        item.logo || item.logo_path || item.logo_url
      );

      return {
        backdrop: backdrop,
        logo: logo,
        fecha: obtenerFecha(item),
        catalogo: catalogo.nombre
      };

    }).filter(item => {

      return item.backdrop && item.logo;

    });

    console.log(
      catalogo.nombre + ": " +
      elementos.length + " contenidos disponibles"
    );

    return elementos;

  } catch (error) {

    console.error(
      "Error cargando " + catalogo.nombre,
      error
    );

    return [];
  }
}

/* =========================================
   ELIMINAR DUPLICADOS
========================================= */

function eliminarDuplicados(elementos) {

  const vistos = new Set();

  return elementos.filter(item => {

    const clave = item.backdrop + "|" + item.logo;

    if (vistos.has(clave)) {
      return false;
    }

    vistos.add(clave);

    return true;
  });
}

/* =========================================
   PRECARGAR IMÁGENES
========================================= */

function precargarImagen(src) {

  return new Promise(resolve => {

    const img = new Image();

    img.onload = () => resolve(true);

    img.onerror = () => resolve(false);

    img.src = src;

  });
}

/* =========================================
   CAMBIAR BANNER
========================================= */

async function cambiarSlide() {

  if (!banners.length) return;

  currentIndex++;

  if (currentIndex >= banners.length) {
    currentIndex = 0;
  }

  const elemento = banners[currentIndex];

  /* Precargar las imágenes */

  const resultados = await Promise.all([
    precargarImagen(elemento.backdrop),
    precargarImagen(elemento.logo)
  ]);

  /* Si falla alguna imagen, pasar al siguiente */

  if (!resultados[0] || !resultados[1]) {

    console.warn(
      "Imagen no disponible. Pasando al siguiente banner."
    );

    if (banners.length > 1) {
      cambiarSlide();
    }

    return;
  }

  /* Cambiar fondo */

  header.style.backgroundImage =
    `url("${elemento.backdrop}")`;

  /* Efecto del logo */

  logoImg.style.opacity = 0;

  setTimeout(() => {

    logoImg.src = elemento.logo;

    logoImg.style.opacity = 1;

  }, 300);

}

/* =========================================
   INICIAR SHARKTV
========================================= */

async function iniciarSharkTV() {

  console.log("Cargando catálogos SHARKTV...");

  const resultados = await Promise.all(
    catalogos.map(cargarCatalogo)
  );

  /* Unir películas, series y Kids */

  banners = resultados.flat();

  /* Eliminar imágenes repetidas */

  banners = eliminarDuplicados(banners);

  /* Ordenar por fecha más reciente */

  banners.sort((a, b) => b.fecha - a.fecha);

  console.log(
    "Total de banners encontrados: " + banners.length
  );

  if (!banners.length) {

    console.error(
      "No se encontraron banners con logo en los catálogos."
    );

    return;
  }

  /* Mostrar primero las novedades */

  currentIndex = -1;

  cambiarSlide();

  /* Cambio automático cada 5 segundos */

  setInterval(cambiarSlide, INTERVALO);

}

/* =========================================
   EFECTOS DEL MENÚ
========================================= */

const menuItems = document.querySelectorAll(".menu-item");

menuItems.forEach(item => {

  item.addEventListener("mouseenter", () => {
    item.classList.add("active");
  });

  item.addEventListener("mouseleave", () => {
    item.classList.remove("active");
  });

});

/* =========================================
   ARRANCAR
========================================= */

iniciarSharkTV();

</script>

</body>
</html>
