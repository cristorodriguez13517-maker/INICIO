<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SHARKTV</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #000;
    color: #fff;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

a, button {
    outline: none;
    -webkit-tap-highlight-color: transparent;
}

a:focus,
a:active,
a:focus-visible {
    outline: none;
}

/* HEADER ORIGINAL */

.header {
    position: relative;
    width: 100%;
    height: 100vh;
    background-size: cover;
    background-position: center;
    transition: background-image 1s ease-in-out;
}

/* SOMBRA LATERAL ORIGINAL */

.header::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 380px;
    height: 100%;
    background: linear-gradient(
        to right,
        rgba(0,0,0,0.90) 0%,
        rgba(0,0,0,0.75) 30%,
        rgba(0,0,0,0) 75%
    );
    z-index: 5;
    pointer-events: none;
}

/* CONTENEDOR DEL MENÚ */

.header-top {
    position: absolute;
    top: 50%;
    left: 0;
    transform: translateY(-50%);
    width: 250px;
    padding-left: 20px;
    z-index: 10;

    opacity: 0;
    visibility: hidden;
    transition: opacity 0.35s ease, visibility 0.35s ease;
}

.header.menu-visible .header-top {
    opacity: 1;
    visibility: visible;
}

/* VENTANA DEL MENÚ: TRES OPCIONES VISIBLES */

.menu-viewport {
    height: 113px;
    overflow: hidden;
}

/* LISTA */

.menu {
    display: flex;
    flex-direction: column;
    gap: 25px;
    transition: transform 0.3s ease;
}

/* OPCIONES: ESTILO DE TU PLANTILLA ORIGINAL */

.menu-item {
    display: block;
    flex-shrink: 0;
    height: 21px;

    color: #fff;
    text-decoration: none;
    font-weight: bold;
    font-size: 18px;

    transition: color 0.2s, transform 0.2s;
    cursor: pointer;
    text-shadow: 0 0 10px rgba(0,0,0,0.9);

    transform-origin: left center;
}

/* RESALTADO ORIGINAL EN ROJO */

.menu-item:hover,
.menu-item.active {
    color: #E50914;
    transform: scale(1.1);
}

/* LOGO ORIGINAL */

.header-logo {
    position: absolute;
    bottom: 60px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
}

.header-logo img {
    max-width: 300px;
    width: 100%;
    object-fit: contain;
    filter: drop-shadow(0 0 15px rgba(0,0,0,0.9));
    transition: opacity 1s ease;
}

/* AVISO DE APARTADO PRÓXIMAMENTE */

.aviso {
    position: absolute;
    bottom: 125px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;

    padding: 12px 24px;
    background: rgba(0,0,0,0.85);
    border-radius: 5px;

    font-size: 16px;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.3s ease;
}

.aviso.visible {
    opacity: 1;
    visibility: visible;
}

/* MÓVILES */

@media (max-width: 700px) {
    .header-top {
        padding-left: 20px;
    }

    .header-logo img {
        max-width: 220px;
    }
}
</style>
</head>

<body>

<div class="header" id="header">

    <!-- MENÚ LATERAL -->

    <div class="header-top">

        <div class="menu-viewport">

            <nav class="menu" id="menu">

                <a href="https://cristorodriguez13517-maker.github.io/PELICULAS/"
                   class="menu-item active">
                    Películas
                </a>

                <a href="https://cristorodriguez13517-maker.github.io/SERIES/"
                   class="menu-item">
                    Series
                </a>

                <a href="https://cristorodriguez13517-maker.github.io/KIDS/"
                   class="menu-item">
                    Kids
                </a>

                <a href="#"
                   class="menu-item"
                   data-coming-soon="true">
                    Colecciones
                </a>

                <a href="#"
                   class="menu-item"
                   data-coming-soon="true">
                    Deportes
                </a>

            </nav>

        </div>

    </div>

    <!-- LOGO -->

    <div class="header-logo">
        <img id="header-logo-img" src="" alt="SHARKTV">
    </div>

    <!-- AVISO -->

    <div class="aviso" id="aviso">
        Próximamente
    </div>

</div>


<script>

/* =====================================
   ELEMENTOS
===================================== */

const header = document.getElementById('header');
const logoImg = document.getElementById('header-logo-img');
const menu = document.getElementById('menu');
const aviso = document.getElementById('aviso');

const menuItems = Array.from(
    document.querySelectorAll('.menu-item')
);


/* =====================================
   BANNERS ORIGINALES
===================================== */

const banners = [

    "https://image.tmdb.org/t/p/original/iIn6exNbm1wtMJ1YNybXlSOTNoj.jpg",

    "https://image.tmdb.org/t/p/original/ybmfvoIPxQ9Ivy2tEhi6JxufMJL.jpg",

    "https://image.tmdb.org/t/p/original/4X2YSe8PaYbsBqX3TDmmIU4vOju.jpg",

    "https://image.tmdb.org/t/p/original/wnR8pwWtoL3TFwP41mLCt91ReCt.jpg",

    "https://image.tmdb.org/t/p/original/jzBWExXacS33rMQ2zLBrqIVweyG.jpg"

];

const logos = [

    "https://image.tmdb.org/t/p/original/pGv2k86yKzO4viRfKvRlYbbedQ2.png",

    "https://image.tmdb.org/t/p/original/tOg7Lyj0VAs5S5auXOziN49Fs2y.png",

    "https://image.tmdb.org/t/p/original/y5IQmJgJvqUDl5WIYW7GUvVyiMx.png",

    "https://image.tmdb.org/t/p/original/3v2tqcDJmJRYrsMYJ1dregKCpdo.png",

    "https://image.tmdb.org/t/p/original/zLEGM0nl8fWDiMg0KtFFXGevb2Z.png"

];


/* =====================================
   CARRUSEL ORIGINAL ALEATORIO
===================================== */

let currentIndex = -1;

function getRandomIndex() {

    let newIndex;

    do {
        newIndex = Math.floor(Math.random() * banners.length);
    } while (newIndex === currentIndex);

    return newIndex;
}

function cambiarSlide() {

    currentIndex = getRandomIndex();

    header.style.backgroundImage =
        `url('${banners[currentIndex]}')`;

    logoImg.style.opacity = 0;

    setTimeout(() => {

        logoImg.src = logos[currentIndex];

        logoImg.style.opacity = 1;

    }, 300);
}

/* INICIO DEL CARRUSEL */

cambiarSlide();

/* PRECARGA */

banners.forEach(src => {

    const img = new Image();

    img.src = src;

});

/* CAMBIO AUTOMÁTICO CADA 5 SEGUNDOS */

setInterval(cambiarSlide, 5000);


/* =====================================
   NAVEGACIÓN DEL MENÚ
===================================== */

let selectedIndex = 0;
let menuVisible = false;

let hideTimer = null;
let avisoTimer = null;

const HIDE_DELAY = 5000;


/* =====================================
   ACTUALIZAR SELECCIÓN
   MANTIENE EL RESALTADO ROJO ORIGINAL
===================================== */

function actualizarSeleccion() {

    menuItems.forEach((item, index) => {

        item.classList.toggle(
            'active',
            index === selectedIndex
        );

    });

    /*
       Solo muestra tres opciones.
       El menú se desplaza al continuar
       navegando hacia abajo.
    */

    const maxInicio = Math.max(0, menuItems.length - 3);

    let inicio = 0;

    if (selectedIndex >= 3) {
        inicio = selectedIndex - 2;
    }

    inicio = Math.min(inicio, maxInicio);

    const altura = 21;
    const espacio = 25;
    const desplazamiento = inicio * (altura + espacio);

    menu.style.transform =
        `translateY(-${desplazamiento}px)`;
}


/* =====================================
   MOSTRAR MENÚ
===================================== */

function mostrarMenu() {

    menuVisible = true;

    header.classList.add('menu-visible');

    actualizarSeleccion();

    reiniciarTemporizador();
}


/* =====================================
   OCULTAR MENÚ
===================================== */

function ocultarMenu() {

    menuVisible = false;

    header.classList.remove('menu-visible');

    clearTimeout(hideTimer);
}


/* =====================================
   AUTOCIERRE
===================================== */

function reiniciarTemporizador() {

    clearTimeout(hideTimer);

    hideTimer = setTimeout(() => {

        ocultarMenu();

    }, HIDE_DELAY);
}


/* =====================================
   AVISO PRÓXIMAMENTE
===================================== */

function mostrarAviso() {

    aviso.classList.add('visible');

    clearTimeout(avisoTimer);

    avisoTimer = setTimeout(() => {

        aviso.classList.remove('visible');

    }, 1800);
}


/* =====================================
   ABRIR OPCIÓN
===================================== */

function abrirSeleccion() {

    const item = menuItems[selectedIndex];

    if (!item) return;

    if (item.dataset.comingSoon === 'true') {

        mostrarAviso();

        reiniciarTemporizador();

        return;
    }

    const destino = item.getAttribute('href');

    if (destino && destino !== '#') {

        window.location.href = destino;

    }
}


/* =====================================
   CONTROL CON MANDO DE TV
===================================== */

document.addEventListener('keydown', function(event) {

    const tecla = event.key;

    const teclasControl = [
        'ArrowUp',
        'ArrowDown',
        'ArrowLeft',
        'ArrowRight',
        'Enter',
        'Escape',
        'Backspace'
    ];

    if (teclasControl.includes(tecla)) {
        event.preventDefault();
    }

    /* SI EL MENÚ ESTÁ OCULTO */

    if (!menuVisible) {

        if (teclasControl.includes(tecla) &&
            tecla !== 'Enter' &&
            tecla !== 'Escape' &&
            tecla !== 'Backspace') {

            mostrarMenu();

        }

        return;
    }

    /* BAJAR */

    if (tecla === 'ArrowDown') {

        if (selectedIndex < menuItems.length - 1) {
            selectedIndex++;
        }

        actualizarSeleccion();

        reiniciarTemporizador();
    }

    /* SUBIR */

    if (tecla === 'ArrowUp') {

        if (selectedIndex > 0) {
            selectedIndex--;
        }

        actualizarSeleccion();

        reiniciarTemporizador();
    }

    /* ACEPTAR */

    if (tecla === 'Enter') {

        abrirSeleccion();

    }

    /* IZQUIERDA Y DERECHA */

    if (
        tecla === 'ArrowLeft' ||
        tecla === 'ArrowRight'
    ) {

        reiniciarTemporizador();

    }

    /* ATRÁS */

    if (
        tecla === 'Escape' ||
        tecla === 'Backspace'
    ) {

        ocultarMenu();

    }

});


/* =====================================
   RATÓN
===================================== */

menuItems.forEach((item, index) => {

    item.addEventListener('mouseenter', () => {

        selectedIndex = index;

        actualizarSeleccion();

        mostrarMenu();

    });

    item.addEventListener('click', event => {

        selectedIndex = index;

        actualizarSeleccion();

        if (item.dataset.comingSoon === 'true') {

            event.preventDefault();

            mostrarMenu();

            mostrarAviso();

        }

    });

});


/* =====================================
   TOQUE EN EL BORDE IZQUIERDO
===================================== */

document.addEventListener('touchstart', function(event) {

    const toque = event.touches[0];

    if (toque.clientX < 35) {

        if (menuVisible) {
            ocultarMenu();
        } else {
            mostrarMenu();
        }

    }

}, { passive: true });


/* =====================================
   ESTADO INICIAL
===================================== */

actualizarSeleccion();

</script>

</body>
</html>
