<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SHARKTV - Seguir viendo</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#000;color:#fff;font-family:Arial,sans-serif;overflow-x:hidden}
.header{position:fixed;top:0;left:0;width:100%;height:520px;min-height:520px;background:#000 center/cover no-repeat;z-index:0;overflow:hidden;padding:20px;display:flex;align-items:flex-start}
.header:before{content:"";position:absolute;inset:0;background:linear-gradient(to right,rgba(0,0,0,.9) 0%,rgba(0,0,0,.55) 35%,transparent 100%),linear-gradient(to bottom,rgba(0,0,0,.12) 42%,rgba(0,0,0,.58) 68%,#000 100%);pointer-events:none}
.header-info{position:absolute;top:160px;left:20px;z-index:2;max-width:500px;max-height:calc(100% - 24px);overflow:auto}
.brand{display:inline-block;color:#fff;font-size:23px;font-weight:900;letter-spacing:2px;text-decoration:none;margin-bottom:18px}.brand span{color:#e50914}
h1{font-size:28px;margin:0 0 10px}.sub{font-size:13px;line-height:1.5;color:#ddd;margin:0;max-width:450px}
.content{position:relative;z-index:1;padding:20px;margin-top:320px;min-height:200px}
.movie-row{display:grid;grid-template-columns:repeat(7,130px);gap:13px;align-items:start;margin-top:15px}
.movie-card{width:130px;min-width:130px;max-width:130px;background:transparent;border:0;overflow:hidden}
.poster{width:130px;height:180px;position:relative;overflow:hidden;border-radius:12px;background:#111}
.poster img{display:block;width:130px;height:180px;object-fit:cover;border:3px solid transparent;border-radius:12px}
.player{position:absolute;top:7px;left:7px;padding:4px 6px;border-radius:4px;font-size:10px;font-weight:bold;background:#b51226;color:#fff}.player.vlc{background:#b66a16}
.info{padding:7px 1px 0}.title{font-size:12px;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:10px;color:#aaa;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.progress{height:4px;border-radius:5px;background:#393939;margin:7px 0 6px;overflow:hidden}.progress span{display:block;height:100%;background:#e50914}
.actions{display:flex;gap:6px}.actions a,.actions button{border:0;border-radius:4px;padding:6px 8px;font-size:10px;font-weight:bold;cursor:pointer}.resume{background:#e50914;color:#fff;flex:1;text-align:center;text-decoration:none}.remove{background:#292929;color:#ddd}
.empty{color:#aaa;font-size:14px;margin-top:18px}.empty strong{display:block;color:#fff;font-size:18px;margin-bottom:8px}
.note{font-size:11px;color:#777;margin-top:24px}
@media(max-width:900px){.movie-row{grid-template-columns:repeat(5,130px)}}
@media(max-width:600px){
 .header{height:430px;min-height:430px;padding:15px}
 .header-info{top:160px;left:15px;right:15px}
 .content{margin-top:320px;padding:12px}
 .movie-row{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
 .movie-card{width:100%;min-width:0;max-width:130px}
 .poster,.poster img{width:100%;height:auto;aspect-ratio:2/3}
 .title{font-size:11px}
}
</style>
</head>
<body>
<header class="header" id="header"><div class="header-info">
<a class="brand" href="./">SHARK<span>TV</span></a>
<h1>▶ Seguir viendo</h1>
<p class="sub">Tus películas y series pendientes, reunidas en un solo lugar.</p>
</div></header>
<main class="content"><section class="movie-row" id="items" aria-live="polite"></section>
<p class="note">El progreso exacto requiere que SmartTube o VLC comuniquen el tiempo reproducido.</p></main>
<script>
const KEY='sharktv_seguir_viendo_v1';
const root=document.getElementById('items');
function read(){try{const x=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(x)?x:[]}catch(e){return[]}}
function save(items){localStorage.setItem(KEY,JSON.stringify(items))}
function render(){
 const items=read();root.replaceChildren();
 const header=document.getElementById('header');
 header.style.backgroundImage=items[0]&&items[0].poster?'linear-gradient(rgba(0,0,0,.25),rgba(0,0,0,.25)),url("'+String(items[0].poster).replace(/["\\]/g,'')+'")':'none';
 if(!items.length){const e=document.createElement('div');e.className='empty';e.innerHTML='<strong>Aún no tienes nada pendiente</strong>Cuando inicies una película o episodio desde SHARKTV, aparecerá aquí.';root.append(e);return}
 items.forEach((item,index)=>{
  const card=document.createElement('article');card.className='movie-card';
  const poster=document.createElement('div');poster.className='poster';
  if(item.poster){const img=document.createElement('img');img.src=item.poster;img.alt=item.title||'Carátula';img.loading='lazy';poster.append(img)}else{poster.textContent='▶'}
  const badge=document.createElement('span');badge.className='player '+(item.player==='VLC'?'vlc':'smarttube');badge.textContent=item.player||'SmartTube';poster.append(badge);
  const info=document.createElement('div');info.className='info';
  const title=document.createElement('div');title.className='title';title.textContent=item.title||'Sin título';
  const meta=document.createElement('div');meta.className='meta';meta.textContent=(Number(item.percent)>0?(Number(item.percent)+'% visto'):'Progreso no disponible')+(item.repo?' · '+item.repo:'');
  const bar=document.createElement('div');bar.className='progress';const fill=document.createElement('span');fill.style.width=Math.max(0,Math.min(99,Number(item.percent)||0))+'%';bar.append(fill);
  const actions=document.createElement('div');actions.className='actions';
  const link=document.createElement('a');link.className='resume';link.textContent='Continuar';
  let continueUrl=item.url||item.fallbackUrl||'#';
  if(item.player==='VLC'&&item.magnetId&&item.filePath&&item.repo){
   const isEpisode=item.kind==='episode';
   const base='/'+item.repo+'/';
   const target=base+'reanudar.html';
   const params=new URLSearchParams({shark_magnet:String(item.magnetId),shark_path:String(item.filePath),shark_kind:isEpisode?'episode':'movie'});
   continueUrl=target+'?'+params.toString();
  }
  link.href=continueUrl;
  link.target='_self';
  link.rel='noopener';
  const del=document.createElement('button');del.className='remove';del.textContent='Quitar';del.addEventListener('click',()=>{const next=read();next.splice(index,1);save(next);render()});
  actions.append(link,del);info.append(title,meta,bar,actions);card.append(poster,info);root.append(card);
 });
}
window.addEventListener('storage',render);render();
</script>
</body>
</html>
