<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SHARKTV - Seguir viendo</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#000;color:#fff;font-family:Arial,sans-serif;overflow-x:hidden}
.header{position:fixed;top:0;left:0;width:100%;height:520px;min-height:520px;background:#000 center/cover no-repeat;z-index:0;overflow:hidden;padding:20px;display:flex;align-items:flex-start}
.header:before{content:"";position:absolute;inset:0;background:linear-gradient(to right,rgba(0,0,0,.9) 0%,rgba(0,0,0,.55) 35%,transparent 100%),linear-gradient(to bottom,rgba(0,0,0,.12) 42%,rgba(0,0,0,.58) 68%,#000 100%);pointer-events:none}
.header-info{position:absolute;top:160px;left:20px;z-index:2;max-width:500px;max-height:calc(100% - 24px);overflow:auto;transform:translateY(-50%)}
.brand{display:inline-block;color:#fff;font-size:23px;font-weight:900;letter-spacing:2px;text-decoration:none;margin-bottom:18px}.brand span{color:#e50914}
h1{font-size:28px;margin:0 0 10px}.sub{font-size:13px;line-height:1.5;color:#ddd;margin:0;max-width:450px}.details{font-size:14px;font-weight:bold;margin:10px 0;line-height:1.7;max-width:480px}.overview{font-size:12px;line-height:1.45;max-width:450px;margin:8px 0 0;white-space:normal}
.content{position:relative;z-index:1;padding:20px;margin-top:320px;min-height:200px}
.movie-row{display:grid;grid-template-columns:repeat(7,130px);gap:13px;align-items:start;margin-top:15px}
.movie-card{width:130px;min-width:130px;max-width:130px;background:transparent;border:0;overflow:hidden;outline:none}
.movie-card:focus,.movie-card:focus-visible{outline:none!important;box-shadow:none!important;border:0!important}
.poster-link{display:block;width:130px;height:180px;position:relative;overflow:hidden;border-radius:12px;background:#111;text-decoration:none;outline:none}
.poster-link:focus,.poster-link:focus-visible{outline:none!important;box-shadow:none!important}
.poster img{display:block;width:130px;height:180px;object-fit:cover;border:3px solid transparent;border-radius:12px;transition:border-color .15s}.movie-card.selected .poster img,.poster-link:focus-visible .poster img{border-color:#e50914}
.movie-card:focus .poster,.movie-card:focus-visible .poster,.poster-link:focus .poster,.poster-link:focus-visible .poster{outline:none!important;box-shadow:none!important;border:0!important}
.player{position:absolute;top:7px;left:7px;width:29px;height:25px;display:flex;align-items:center;justify-content:center;border-radius:6px;background:#b51226;color:#fff;box-shadow:0 1px 5px #0009}.player svg{display:block;width:20px;height:18px}.player.vlc{background:#fff}
.info{padding:7px 1px 0}.title{font-size:12px;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:10px;color:#aaa;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.progress{height:4px;border-radius:5px;background:#393939;margin:7px 0 6px;overflow:hidden}.progress span{display:block;height:100%;background:#e50914}
.actions{display:flex;gap:6px}.actions a,.actions button{border:0;border-radius:4px;padding:8px 10px;min-height:36px;font-size:11px;font-weight:bold;cursor:pointer;outline:none}
.actions .remove{background:#292929;color:#ddd;flex:1;text-align:center;white-space:nowrap}
.actions a:focus,.actions button:focus,.actions a:focus-visible,.actions button:focus-visible{outline:none!important;box-shadow:none!important}
.actions .remove:hover{background:#444}.resume{background:#e50914;color:#fff;flex:1;text-align:center;text-decoration:none}
.search-container{position:fixed;top:20px;right:30px;display:flex;align-items:center;gap:10px;z-index:1001}.search-button{background:transparent;border:0;padding:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:50%}.search-button svg{width:26px;height:26px;fill:#fff}.search-input{width:0;min-width:0;padding:8px 0;border:0;border-radius:20px;background:rgba(0,0,0,.9);color:#fff;outline:none;opacity:0;pointer-events:none;transition:width .2s,opacity .2s,padding .2s}.search-input.active{width:220px;padding:9px 12px;border:1px solid rgba(255,255,255,.5);opacity:1;pointer-events:auto}.movie-card[hidden]{display:none!important}.empty{color:#aaa;font-size:14px;margin-top:18px}.empty strong{display:block;color:#fff;font-size:18px;margin-bottom:8px}
.note{font-size:11px;color:#777;margin-top:24px}
@media(max-width:900px){.movie-row{grid-template-columns:repeat(5,130px)}}
@media(max-width:600px){
 .header{height:430px;min-height:430px;padding:15px}
 .header-info{top:160px;left:15px;right:15px}.search-container{right:15px;top:15px}.search-input.active{width:170px}
 .content{margin-top:320px;padding:12px}
 .movie-row{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
 .movie-card{width:100%;min-width:0;max-width:130px}
 .poster-link{width:100%;height:auto;aspect-ratio:2/3}
 .poster,.poster img{width:100%;height:auto;aspect-ratio:2/3}
 .actions a,.actions button{min-height:44px;font-size:12px;padding:10px 8px}
 .title{font-size:11px}
}
</style>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
</head>
<body>
<div class="search-container"><button id="search-button" class="search-button" type="button" aria-label="Abrir buscador"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C8.01 14 6 11.99 6 9.5S8.01 5 10.5 5 15 7.01 15 9.5 12.99 14 10.5 14z"/></svg></button><input id="search" class="search-input" type="text" placeholder="Buscar película o serie..." aria-label="Buscar contenido" autocomplete="off"></div>
<header class="header" id="header"><div class="header-info">
<a class="brand" href="./">SHARK<span>TV</span></a>
<h1 id="hero-title">▶ Seguir viendo</h1>
<div id="hero-meta" class="details"></div>
<p id="hero-overview" class="overview">Tus películas y series pendientes, reunidas en un solo lugar.</p>
</div></header>
<main class="content"><section class="movie-row" id="items" aria-live="polite"></section>
</main>
<script>
const KEY='sharktv_seguir_viendo_v1';
const root=document.getElementById('items');
const searchInput=document.getElementById('search');
const searchButton=document.getElementById('search-button');
const heroTitle=document.getElementById('hero-title');
const heroMeta=document.getElementById('hero-meta');
const heroOverview=document.getElementById('hero-overview');
function updateHero(item){if(!item){heroTitle.textContent='▶ Seguir viendo';heroMeta.textContent='';heroOverview.textContent='Tus películas y series pendientes, reunidas en un solo lugar.';return}heroTitle.textContent=item.title||'Contenido';heroMeta.textContent=[item.year,item.quality,item.ageRating].filter(Boolean).join(' · ');heroOverview.textContent=item.overview||item.description||'Contenido guardado en Seguir viendo.';const banner=item.backdrop||item.banner||item.poster;document.getElementById('header').style.backgroundImage=banner?'linear-gradient(to right,rgba(0,0,0,.35),rgba(0,0,0,.08)),url("'+String(banner).replace(/["\\\\]/g,'')+'")':'none'}
searchButton.addEventListener('click',()=>{searchInput.classList.toggle('active');if(searchInput.classList.contains('active'))searchInput.focus();else{searchInput.value='';filterItems()}});
searchInput.addEventListener('input',filterItems);
function filterItems(){const q=searchInput.value.trim().toLocaleLowerCase('es');root.querySelectorAll('.movie-card').forEach(card=>{card.hidden=!card.dataset.search.includes(q)})}
function read(){try{const x=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(x)?x:[]}catch(e){return[]}}
function save(items){localStorage.setItem(KEY,JSON.stringify(items))}
function getExternalPlaybackUrl(item){
 // Para AllDebrid se abre el catálogo correcto con los datos del archivo.
 // El propio catálogo ejecuta su flujo seguro de Turnstile y Worker y lanza VLC.
 if(item.player==='VLC'&&item.magnetId&&item.filePath){
  const repo=String(item.repo||'ALLDEBRID-PELICULAS').toUpperCase();
  const bases={
   'ALLDEBRID-PELICULAS':'https://cristorodriguez13517-maker.github.io/ALLDEBRID-PELICULAS/',
   'ALLDEBRID-SERIES':'https://cristorodriguez13517-maker.github.io/ALLDEBRID-SERIES/',
   'ALLDEBRID-KIDS':'https://cristorodriguez13517-maker.github.io/ALLDEBRID-KIDS/'
  };
  const base=bases[repo]||bases['ALLDEBRID-PELICULAS'];
  const params=new URLSearchParams({shark_magnet:String(item.magnetId),shark_path:String(item.filePath),shark_kind:String(item.kind||'movie')});
  if((repo==='ALLDEBRID-SERIES'||repo==='ALLDEBRID-KIDS')&&item.seriesId){
   return base+'series.html?id='+encodeURIComponent(item.seriesId)+'&'+params.toString();
  }
  return base+'?'+params.toString();
 }
 // Los enlaces de SmartTube/YouTube se entregan al sistema para abrir la app asociada.
 return item.sourceUrl||item.url||item.fallbackUrl||'#';
}
function getFichaUrl(item){
 const repo=String(item.repo||'PELICULAS').toUpperCase();
 const bases={
  'PELICULAS':'https://cristorodriguez13517-maker.github.io/PELICULAS/',
  'SERIES':'https://cristorodriguez13517-maker.github.io/SERIES/',
  'KIDS':'https://cristorodriguez13517-maker.github.io/KIDS/',
  'ALLDEBRID-PELICULAS':'https://cristorodriguez13517-maker.github.io/ALLDEBRID-PELICULAS/',
  'ALLDEBRID-SERIES':'https://cristorodriguez13517-maker.github.io/ALLDEBRID-SERIES/',
  'ALLDEBRID-KIDS':'https://cristorodriguez13517-maker.github.io/ALLDEBRID-KIDS/'
 };
 const base=bases[repo]||bases.PELICULAS;
 // Los episodios guardan la dirección exacta de la ficha de su serie.
 if(item.resumeUrl&&/series\.html\?id=/i.test(item.resumeUrl))return item.resumeUrl;
 if(item.seriesId)return base+'series.html?id='+encodeURIComponent(item.seriesId);
 if(repo==='SERIES'&&item.kind==='episode'){
  let seriesId=String(item.id||'').replace(/^SERIES\|/,'').split('|')[0];
  if(seriesId)return base+'series.html?id='+encodeURIComponent(seriesId);
 }
 // El ID compuesto de AllDebrid incluye también el archivo; la ficha se busca por el ID de catálogo.
 let id=String(item.catalogId||item.id||'');
 if(id.startsWith(repo+'|'))id=id.slice(repo.length+1);
 id=id.split('|')[0];
 return id?base+'?shark_ficha='+encodeURIComponent(id):(item.resumeUrl||base);
}
const ALLDEBRID_WORKER_URL='https://alldebrid-vlc.cristorodriguez13517.workers.dev/';
const ALLDEBRID_TURNSTILE_KEY='0x4AAAAAAGK-CFVW1ivlcFRe';
let continueTurnstileId=null,continueTurnstileResolve=null,continueTurnstileReject=null,continueBusy=false;
async function obtenerTokenContinuar(){
 const limit=Date.now()+15000;
 while(!window.turnstile&&Date.now()<limit)await new Promise(r=>setTimeout(r,100));
 if(!window.turnstile)throw new Error('No se pudo cargar la verificación de Cloudflare.');
 let host=document.getElementById('continue-turnstile');
 if(!host){host=document.createElement('div');host.id='continue-turnstile';host.style.cssText='position:fixed;left:-10000px;top:-10000px;width:0;height:0;overflow:hidden';document.body.appendChild(host)}
 if(continueTurnstileId===null){
  continueTurnstileId=window.turnstile.render(host,{
   sitekey:ALLDEBRID_TURNSTILE_KEY,action:'reproducir',execution:'execute',size:'invisible',appearance:'interaction-only',
   callback:token=>{if(continueTurnstileResolve){const done=continueTurnstileResolve;continueTurnstileResolve=null;continueTurnstileReject=null;done(token)}},
   'error-callback':code=>{if(continueTurnstileReject){const fail=continueTurnstileReject;continueTurnstileResolve=null;continueTurnstileReject=null;fail(new Error('Cloudflare Turnstile: '+(code||'error de verificación')))}},
   'unsupported-callback':()=>{if(continueTurnstileReject){const fail=continueTurnstileReject;continueTurnstileResolve=null;continueTurnstileReject=null;fail(new Error('Este navegador no admite la verificación de Cloudflare.'))}},
   'timeout-callback':()=>{if(continueTurnstileReject){const fail=continueTurnstileReject;continueTurnstileResolve=null;continueTurnstileReject=null;fail(new Error('La verificación de Cloudflare ha agotado el tiempo.'))}},
   'expired-callback':()=>{if(continueTurnstileReject){const fail=continueTurnstileReject;continueTurnstileResolve=null;continueTurnstileReject=null;fail(new Error('La verificación ha caducado. Vuelve a pulsar Continuar.'))}}
  });
 }
 return new Promise((resolve,reject)=>{
  continueTurnstileResolve=resolve;continueTurnstileReject=reject;
  window.turnstile.reset(continueTurnstileId);window.turnstile.execute(continueTurnstileId);
  setTimeout(()=>{if(continueTurnstileReject===reject){continueTurnstileResolve=null;continueTurnstileReject=null;reject(new Error('La verificación está tardando demasiado.'))}},30000);
 });
}
function abrirEnVLC(url){
 const u=new URL(url);
 if(u.protocol!=='https:'&&u.protocol!=='http:')throw new Error('AllDebrid devolvió un enlace no válido.');
 if(/Android/i.test(navigator.userAgent)){
  const intent='intent://'+u.host+u.pathname+u.search+'#Intent;scheme='+u.protocol.slice(0,-1)+';package=org.videolan.vlc;type=video/*;S.browser_fallback_url='+encodeURIComponent(u.href)+';end';
  location.href=intent;
 }else location.href=u.href;
}
async function handleContinueClick(event,item){
 if(item.player!=='VLC')return;
 event.preventDefault();
 if(continueBusy)return;
 if(!item.magnetId||!item.filePath){alert('Este elemento no tiene guardados el identificador y el archivo de AllDebrid. Abre su ficha y vuelve a seleccionarlo para actualizar Seguir viendo.');return}
 continueBusy=true;
 const link=event.currentTarget,original=link.textContent;
 link.textContent='Preparando enlace…';
 try{
  const token=await obtenerTokenContinuar();
  const response=await fetch(ALLDEBRID_WORKER_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tipo:item.kind||'movie',magnet_id:String(item.magnetId),file_path:String(item.filePath),token})});
  const result=await response.json().catch(()=>({}));
  if(!response.ok||!result.url)throw new Error(result.error||'AllDebrid no ha podido generar el enlace directo.');
  abrirEnVLC(result.url);
 }catch(error){
  console.error('SHARKTV Seguir viendo / AllDebrid:',error);
  alert(error.message||'No se pudo abrir el enlace directo en VLC.');
  link.textContent=original;
 }finally{
  continueBusy=false;
  if(window.turnstile&&continueTurnstileId!==null)window.turnstile.reset(continueTurnstileId);
 }
}
function render(){
 const items=read();root.replaceChildren();
 const header=document.getElementById('header');
 header.style.backgroundImage=items[0]&&items[0].poster?'linear-gradient(rgba(0,0,0,.25),rgba(0,0,0,.25)),url("'+String(items[0].poster).replace(/["\\]/g,'')+'")':'none';
 if(!items.length){const e=document.createElement('div');e.className='empty';e.innerHTML='<strong>Aún no tienes nada pendiente</strong>Cuando inicies una película o episodio desde SHARKTV, aparecerá aquí.';root.append(e);return}
 items.forEach((item,index)=>{
  const card=document.createElement('article');card.className='movie-card';card.tabIndex=0;card.dataset.search=String((item.title||'')+' '+(item.repo||'')).toLocaleLowerCase('es');card.addEventListener('focusin',()=>{card.classList.add('selected');updateHero(item)});card.addEventListener('mouseenter',()=>{root.querySelectorAll('.movie-card.selected').forEach(x=>x.classList.remove('selected'));card.classList.add('selected');updateHero(item)});card.setAttribute('role','group');card.setAttribute('aria-label',(item.title||'Contenido')+'; usa las flechas para moverte y Enter para continuar');
  const fichaUrl=getFichaUrl(item);
  const poster=document.createElement('a');poster.className='poster-link';poster.href=fichaUrl;poster.target='_self';poster.setAttribute('aria-label','Ver información de '+(item.title||'contenido'));
  const posterBox=document.createElement('div');posterBox.className='poster';
  if(item.poster){const img=document.createElement('img');img.src=item.poster;img.alt=item.title||'Carátula';img.loading='lazy';posterBox.append(img)}else{posterBox.textContent='▶'}
  const badge=document.createElement('span');badge.className='player '+(item.player==='VLC'?'vlc':'smarttube');
  if(item.player==='VLC'){
   badge.innerHTML='<svg viewBox="0 0 24 24" role="img" aria-label="VLC"><path fill="#f28c28" d="M10.2 2.2c-.5.2-.8.8-.6 1.3l1 2.4-5.8 13.5c-.4 1 .3 2.1 1.4 2.1h11.6c1.1 0 1.8-1.1 1.4-2.1L13.4 5.9l1-2.4c.2-.5-.1-1.1-.6-1.3-.6-.2-1.2.1-1.4.7l-.5 1.2-.5-1.2c-.2-.6-.8-.9-1.2-.7Z"/><path fill="#fff" d="m8.2 10.4 7.6 1.3 1.2 2.8-10-1.7zM5.7 16.3l12.6 2.1.5 1.2H5.2z"/><path fill="#e85d24" d="m10.6 5.9 2.8.5 1.1 2.6-5-.9z"/></svg>';
   badge.setAttribute('aria-label','Reproducir con VLC');badge.title='VLC';
  }else{
   badge.innerHTML='<svg viewBox="0 0 24 24" role="img" aria-label="YouTube"><rect x="1" y="4" width="22" height="16" rx="5" fill="#fff"/><path d="M10 8.2 16 12l-6 3.8z" fill="#e50914"/></svg>';
   badge.setAttribute('aria-label','YouTube');badge.title='YouTube';
  }
  posterBox.append(badge);poster.append(posterBox);
  const info=document.createElement('div');info.className='info';
  const title=document.createElement('div');title.className='title';title.textContent=item.title||'Sin título';
  const actions=document.createElement('div');actions.className='actions';
  const link=document.createElement('a');link.className='resume';link.textContent='Continuar';
  link.href=continueUrl;
  link.target=item.player==='VLC'?'_self':'_blank';
  if(item.player!=='VLC')link.rel='noopener';link.addEventListener('click',e=>handleContinueClick(e,item));
  const del=document.createElement('button');del.className='remove';del.textContent='Quitar';del.setAttribute('aria-label','Quitar '+(item.title||'contenido'));del.addEventListener('click',()=>{const next=read();next.splice(index,1);save(next);render()});
  actions.append(link,del);info.append(title,actions);card.append(poster,info);root.append(card);
 });
}
function columns(){
 const style=getComputedStyle(root);
 const template=style.gridTemplateColumns;
 return template&&template!=='none'?template.split(' ').length:1;
}
function cards(){return Array.from(root.querySelectorAll('.movie-card'))}
root.addEventListener('keydown',e=>{
 const card=e.target.closest('.movie-card');
 if(!card)return;
 const list=cards(),i=list.indexOf(card),cols=columns();
 const key=e.key,code=e.keyCode||e.which;
 let next=-1;
 if(key==='ArrowRight'||code===22)next=Math.min(list.length-1,i+1);
 else if(key==='ArrowLeft'||code===21)next=Math.max(0,i-1);
 else if(key==='ArrowDown'||code===20)next=Math.min(list.length-1,i+cols);
 else if(key==='ArrowUp'||code===19)next=Math.max(0,i-cols);
 else if(key==='Enter'||key===' '||code===23||code===66){
  if(e.target.closest('button'))return;
  e.preventDefault();
  const link=card.querySelector('.resume');
  if(link&&link.href&&!link.href.endsWith('#'))link.click();
  return;
 }else return;
 e.preventDefault();
 if(next>=0&&list[next])list[next].focus({preventScroll:true});
});
root.addEventListener('focusin',e=>{
 const card=e.target.closest('.movie-card');
 if(card)card.scrollIntoView({block:'nearest',inline:'nearest'});
});
window.addEventListener('storage',render);render();
</script>
<script id="shark-hide-posters-below-synopsis">
(function(){
 const mq=window.matchMedia('(max-width:600px) and (orientation:portrait)');
 let raf=0,observer=null,bound=new WeakSet(),resizeObserver=null;
 function getCards(){return Array.from(document.querySelectorAll('#items .movie-card'))}
 function getSynopsis(){return document.querySelector('#hero-overview')||document.querySelector('.header-info .overview')}
 function update(){
  raf=0;
  const cards=getCards();
  if(!mq.matches){
   cards.forEach(card=>{card.style.removeProperty('opacity');card.style.removeProperty('transition');card.style.removeProperty('pointer-events')});
   return;
  }
  const synopsis=getSynopsis();
  if(!synopsis)return;
  const boundary=synopsis.getBoundingClientRect().top;
  const hideBefore=300;
  cards.forEach(card=>{
   const bottom=card.getBoundingClientRect().bottom;
   const visible=bottom>boundary+hideBefore?1:0;
   card.style.setProperty('transition','none');
   card.style.setProperty('opacity',String(visible),'important');
   card.style.setProperty('pointer-events',visible===0?'none':'auto');
  });
 }
 function request(){if(!raf)raf=requestAnimationFrame(update)}
 function bindScroll(){
  window.addEventListener('scroll',request,{passive:true,capture:true});
  document.addEventListener('scroll',request,{passive:true,capture:true});
  document.addEventListener('touchmove',request,{passive:true});
  if(window.visualViewport)window.visualViewport.addEventListener('scroll',request,{passive:true});
 }
 function init(){
  bindScroll();
  if(observer)observer.disconnect();
  observer=new MutationObserver(()=>{request()});
  observer.observe(document.body,{childList:true,subtree:true,characterData:true});
  if(window.ResizeObserver){
   resizeObserver=new ResizeObserver(request);
   const synopsis=getSynopsis();if(synopsis)resizeObserver.observe(synopsis);
   const items=document.getElementById('items');if(items)resizeObserver.observe(items);
  }
  request();
 }
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();
 if(mq.addEventListener)mq.addEventListener('change',request);else mq.addListener(request);
 window.addEventListener('resize',request,{passive:true});
})();
</script>
